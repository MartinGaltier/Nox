[package]
name = "nox-activities"
description = "AI agent tracking, window-region watch, timers and companion."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nox-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
memchr = "2"
rusqlite = "0.37"
libc.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-app-kit = { workspace = true, default-features = false, features = ["std", "libc", "NSSound", "NSRunningApplication"] }
security-framework = "3"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[lints]
workspace = true
