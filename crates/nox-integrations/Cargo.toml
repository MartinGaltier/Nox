[package]
name = "nox-integrations"
description = "Music, calendar, notifications, camera, accessories, downloads, files and shortcuts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nox-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSAppleEventDescriptor",
    "NSAppleScript",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSPredicate",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSValue",
] }
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSPasteboard",
    "NSRunningApplication",
    "NSSharingService",
    "NSWorkspace",
] }

[lints]
workspace = true
