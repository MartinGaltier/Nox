[workspace]
resolver = "3"
members = [
    "crates/nox-core",
    "crates/nox-metrics",
    "crates/nox-power",
    "crates/nox-helper",
    "crates/nox-integrations",
    "crates/nox-activities",
    "crates/nox-ui",
    "crates/nox-app",
]
default-members = ["crates/nox-app", "crates/nox-helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MartinGaltier/Nox"
authors = ["Martin Galtier"]
rust-version = "1.90"

[workspace.dependencies]
nox-core = { path = "crates/nox-core" }
nox-metrics = { path = "crates/nox-metrics" }
nox-power = { path = "crates/nox-power" }
nox-integrations = { path = "crates/nox-integrations" }
nox-activities = { path = "crates/nox-activities" }
nox-ui = { path = "crates/nox-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
libc = "0.2"

objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-io-kit = "0.3"
objc2-event-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-core-bluetooth = "0.3"
objc2-user-notifications = "0.3"
objc2-service-management = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
panic = "unwind"
